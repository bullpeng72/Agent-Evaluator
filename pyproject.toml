[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-evaluator"
version = "0.5.7"
description = "Production-ready evaluation framework for AI agents — 25 metrics across task completion, accuracy, hallucination, latency, security, and agentic behavior"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Sungwoo Kim", email = "sungwoo.kim@gmail.com"},
]
maintainers = [
    {name = "Sungwoo Kim", email = "sungwoo.kim@gmail.com"},
]
keywords = [
    "ai", "agent", "evaluation", "monitoring", "performance",
    "llm", "langchain", "crewai", "langgraph", "autogen",
    "hallucination", "accuracy", "latency", "token", "security",
    "rag", "deepeval", "ragas", "observability", "benchmark",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.20.0,<2.0.0",
    "pandas>=1.3.0,<3.0.0",
    "python-dotenv>=0.19.0,<2.0.0",
]

[project.optional-dependencies]
# LLM 클라이언트 — LLMHelper / ClaudeHelper 사용 시
llm = [
    "openai>=1.0.0,<3.0.0",
    "anthropic>=0.20.0,<1.0.0",
]
# 에이전트 프레임워크 통합 — LangChain / LangGraph / CrewAI / AutoGen
frameworks = [
    "langchain>=0.1.0,<3.0.0",
    "langchain-openai>=0.1.0,<3.0.0",
    "langchain-anthropic>=0.1.0,<3.0.0",
    "langgraph>=0.1.0,<3.0.0",
    "crewai>=0.1.0,<2.0.0",
    "pyautogen>=0.2.0,<1.0.0",
]
# 외부 평가 라이브러리 — DeepEval / Ragas
eval = [
    "deepeval>=0.20.0,<4.0.0",
    "ragas>=0.1.0,<2.0.0",
    "datasets>=2.14.0",
    "langchain>=0.1.0,<3.0.0",
    "langchain-openai>=0.1.0,<3.0.0",
]
# 웹 대시보드 — agent-eval serve
serve = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "python-multipart>=0.0.9,<1.0.0",
]
# 전체
all = [
    "openai>=1.0.0,<3.0.0",
    "anthropic>=0.20.0,<1.0.0",
    "langchain>=0.1.0,<3.0.0",
    "langchain-openai>=0.1.0,<3.0.0",
    "langchain-anthropic>=0.1.0,<3.0.0",
    "langgraph>=0.1.0,<3.0.0",
    "crewai>=0.1.0,<2.0.0",
    "pyautogen>=0.2.0,<1.0.0",
    "deepeval>=0.20.0,<4.0.0",
    "ragas>=0.1.0,<2.0.0",
    "datasets>=2.14.0",
    "pypdf>=3.0.0,<7.0.0",
    "pdfplumber>=0.10.0,<1.0.0",
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "python-multipart>=0.0.9,<1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
    "pre-commit>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/bullpeng72/Agent-Evaluator"
Repository = "https://github.com/bullpeng72/Agent-Evaluator"
"Bug Tracker" = "https://github.com/bullpeng72/Agent-Evaluator/issues"
Documentation = "https://github.com/bullpeng72/Agent-Evaluator/blob/main/README.md"

[project.scripts]
agent-eval = "agent_evaluator.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["agent_evaluator"]

[tool.hatch.build.targets.sdist]
include = [
    "agent_evaluator/",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]
exclude = [
    "Evaluator_Examples/",
    "Docs/",
    "HTML_Book/",
    "catboost_info/",
    "output/",
    "dist/",
    ".env",
    "*.DS_Store",
]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP007"]  # UP007: Union[X,Y] → X|Y (py38 compat)

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=agent_evaluator --cov-report=html --cov-report=term"
asyncio_mode = "auto"
