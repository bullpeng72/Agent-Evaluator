[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-evaluator"
version = "0.6.7"
description = "Production-ready evaluation framework for AI agents — 25 metrics across task completion, accuracy, hallucination, latency, security, and agentic behavior"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Sungwoo Kim", email = "sungwoo.kim@gmail.com"},
]
maintainers = [
    {name = "Sungwoo Kim", email = "sungwoo.kim@gmail.com"},
]
keywords = [
    "ai", "agent", "evaluation", "monitoring", "performance",
    "llm", "langchain", "crewai", "langgraph", "autogen",
    "hallucination", "accuracy", "latency", "token", "security",
    "rag", "deepeval", "ragas", "observability", "benchmark",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.20.0,<3.0.0",
    "pandas>=1.3.0,<4.0.0",
    "python-dotenv>=0.19.0,<2.0.0",
]

[project.optional-dependencies]
# ── 단위 extras ─────────────────────────────────────────────────────────────

# LLM 클라이언트 — LLMHelper / ClaudeHelper 사용 시 (빠름, ~5개 패키지)
llm = [
    "openai>=1.0.0,<3.0.0",
    "anthropic>=0.20.0,<1.0.0",
]
# LangChain / LangGraph 통합 (중간, ~30개 패키지)
# langchain 1.x LCEL Runnable 기반, BaseCallbackHandler 실시간 추적
langchain = [
    "langchain>=1.0.0,<3.0.0",
    "langchain-core>=1.0.0,<3.0.0",
    "langchain-openai>=0.1.0,<3.0.0",
    "langchain-anthropic>=0.1.0,<3.0.0",
    "langgraph>=1.0.0,<3.0.0",
]
# CrewAI 통합 (무거움 — 전이 의존성 100개+, 단독 격리)
# crewai 1.x: CrewOutput.raw, crew.usage_metrics, result.tasks_output
crewai = [
    "crewai>=1.0.0,<2.0.0",
]
# AutoGen 통합 (무거움, 단독 격리)
# autogen-agentchat 0.7.x async-first API: on_messages(), team.run()
autogen = [
    "pyautogen>=0.3.0,<1.0.0",
    "autogen-agentchat>=0.4.0,<1.0.0",
    "autogen-core>=0.4.0,<1.0.0",
]
# 외부 평가 라이브러리 — DeepEval / Ragas (무거움, langchain 필요)
# ragas 0.4.x API: EvaluationDataset + SingleTurnSample, datasets>=4.0.0 필요
eval = [
    "deepeval>=0.20.0,<4.0.0",
    "ragas>=0.4.0,<2.0.0",
    "datasets>=4.0.0,<6.0.0",
    "langchain>=0.2.0,<3.0.0",
    "langchain-openai>=0.1.0,<3.0.0",
]
# 웹 대시보드 — agent-eval serve (빠름, ~8개 패키지)
serve = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "python-multipart>=0.0.9,<1.0.0",
]
# PDF 처리 (빠름, ~3개 패키지)
pdf = [
    "pypdf>=3.0.0,<7.0.0",
    "pdfplumber>=0.10.0,<1.0.0",
]
# 운영 실시간 모니터링 — Phoenix + OTEL (중간, ~20개 패키지)
# agent-eval monitor 명령어 전용. [all]에 미포함 (Phoenix가 무거우므로 별도 유지), [full]에 포함
otel = [
    "opentelemetry-sdk>=1.20.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0,<2.0.0",
    "opentelemetry-semantic-conventions>=0.41b0",
    "arize-phoenix>=0.11.0",
]

# ── 조합 편의 extras ─────────────────────────────────────────────────────────

# 기존 호환 — LangChain + CrewAI + AutoGen 한 번에 (무거움)
# ⚠️ crewai(pydantic<2.12)와 pyautogen(pydantic>=2.12 선호) 간 silent downgrade 발생 가능
frameworks = [
    "langchain>=1.0.0,<3.0.0",
    "langchain-core>=1.0.0,<3.0.0",
    "langchain-openai>=0.1.0,<3.0.0",
    "langchain-anthropic>=0.1.0,<3.0.0",
    "langgraph>=1.0.0,<3.0.0",
    "crewai>=1.0.0,<2.0.0",
    "pyautogen>=0.3.0,<1.0.0",
    "autogen-agentchat>=0.4.0,<1.0.0",
    "autogen-core>=0.4.0,<1.0.0",
]
# 일반 사용자 권장 — crewai/autogen 제외, 합리적 설치 시간
all = [
    "openai>=1.0.0,<3.0.0",
    "anthropic>=0.20.0,<1.0.0",
    "langchain>=1.0.0,<3.0.0",
    "langchain-core>=1.0.0,<3.0.0",
    "langchain-openai>=0.1.0,<3.0.0",
    "langchain-anthropic>=0.1.0,<3.0.0",
    "langgraph>=1.0.0,<3.0.0",
    "deepeval>=0.20.0,<4.0.0",
    "ragas>=0.4.0,<2.0.0",
    "datasets>=4.0.0,<6.0.0",
    "pypdf>=3.0.0,<7.0.0",
    "pdfplumber>=0.10.0,<1.0.0",
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "python-multipart>=0.0.9,<1.0.0",
]
# 전체 (crewai/autogen/otel 포함 — ⚠️ 설치 10분+ 소요, pydantic 버전 충돌 silent downgrade 가능)
full = [
    "openai>=1.0.0,<3.0.0",
    "anthropic>=0.20.0,<1.0.0",
    "langchain>=1.0.0,<3.0.0",
    "langchain-core>=1.0.0,<3.0.0",
    "langchain-openai>=0.1.0,<3.0.0",
    "langchain-anthropic>=0.1.0,<3.0.0",
    "langgraph>=1.0.0,<3.0.0",
    "crewai>=1.0.0,<2.0.0",
    "pyautogen>=0.3.0,<1.0.0",
    "autogen-agentchat>=0.4.0,<1.0.0",
    "autogen-core>=0.4.0,<1.0.0",
    "deepeval>=0.20.0,<4.0.0",
    "ragas>=0.4.0,<2.0.0",
    "datasets>=4.0.0,<6.0.0",
    "pypdf>=3.0.0,<7.0.0",
    "pdfplumber>=0.10.0,<1.0.0",
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "opentelemetry-sdk>=1.20.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0,<2.0.0",
    "opentelemetry-semantic-conventions>=0.41b0",
    "arize-phoenix>=0.11.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
    "pre-commit>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/bullpeng72/Agent-Evaluator"
Repository = "https://github.com/bullpeng72/Agent-Evaluator"
"Bug Tracker" = "https://github.com/bullpeng72/Agent-Evaluator/issues"
Documentation = "https://github.com/bullpeng72/Agent-Evaluator/blob/main/README.md"

[project.scripts]
agent-eval = "agent_evaluator.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["agent_evaluator"]

[tool.hatch.build.targets.sdist]
include = [
    "agent_evaluator/",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]
exclude = [
    "Evaluator_Examples/",
    "Docs/",
    "HTML_Book/",
    "catboost_info/",
    "output/",
    "dist/",
    ".env",
    "*.DS_Store",
]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP007"]  # UP007: Union[X,Y] → X|Y (py38 compat)

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=agent_evaluator --cov-report=html --cov-report=term"
asyncio_mode = "auto"
