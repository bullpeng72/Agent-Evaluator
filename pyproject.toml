    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
    "pre-commit>=3.0.0",
    "jsonschema>=4.0.0",  # harness_groups 출력 계약(schemas/harness_groups.schema.json) contract test용
    # PYSEC-2026-3447: setuptools < 83.0.0 취약점 — pip-audit 차단. 빌드/venv baseline 패키지라
    # 여기서 하한을 걸어 CI(`pip install -e ".[dev]"`)가 안전한 버전을 끌어오게 한다.
    # setuptools 81+ 는 Python 3.9+ 요구 → requires-python(3.8) 호환 위해 마커로 스코프.
    "setuptools>=83.0.0; python_version >= '3.9'",
