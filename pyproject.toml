[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evaluator"
version = "0.5.0"
description = "Production-ready evaluation framework for AI agents"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "Sungwoo Kim", email = "sungwoo.kim@gmail.com"}
]
keywords = [
    "ai",
    "agent",
    "evaluation",
    "monitoring",
    "performance",
    "langchain",
    "crewai",
    "autogen"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.20.0,<2.0.0",
    "pandas>=1.3.0",
    "python-dotenv>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]
deepeval = [
    "deepeval>=0.20.0",
]
ragas = [
    "ragas>=0.1.0",
]
langchain = [
    "langchain>=0.1.0",
]
all = [
    "deepeval>=0.20.0",
    "ragas>=0.1.0",
    "langchain>=0.1.0",
]

# [project.urls]
# Documentation = "https://github.com/yourusername/agent-evaluator/docs"
# Repository = "https://github.com/yourusername/agent-evaluator"
# Issues = "https://github.com/yourusername/agent-evaluator/issues"

[tool.setuptools]
packages = ["agent_evaluator", "agent_evaluator.core", "agent_evaluator.datasets",
            "agent_evaluator.helpers", "agent_evaluator.integrations",
            "agent_evaluator.reporting", "agent_evaluator.utils", "agent_evaluator.examples"]

[tool.setuptools.package-data]
agent_evaluator = ["*.json", "*.yaml", "*.yml"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=agent_evaluator --cov-report=html --cov-report=term"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
