# ────────────────────────────────────────────────────────────────────────────
# 그 외: 단일 기능 소형 extras (위 5개 카테고리에 안 들어가는 부가 연동)
# ────────────────────────────────────────────────────────────────────────────

# 대시보드 Parquet / Excel 내보내기
# agent_evaluator/serve/routers/export.py 에서 사용
# 미설치 시: Parquet 엔드포인트 HTTP 409, Excel 엔드포인트 HTTP 501 반환
export = [
    "pyarrow>=10.0.0",
    "openpyxl>=3.1.0",
]
# Weights & Biases 실험 추적 연동
# PerformanceMonitor.export_to_wandb() 에서 사용
wandb = [
    "wandb>=0.17.0",
]
# MLflow 실험 추적 연동
# PerformanceMonitor.export_to_mlflow() 에서 사용
mlflow = [
    "mlflow>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/bullpeng72/Agent-Evaluator"
Repository = "https://github.com/bullpeng72/Agent-Evaluator"
"Bug Tracker" = "https://github.com/bullpeng72/Agent-Evaluator/issues"
Documentation = "https://github.com/bullpeng72/Agent-Evaluator/blob/Agent-Evaluator/README.md"
Changelog = "https://github.com/bullpeng72/Agent-Evaluator/blob/Agent-Evaluator/CHANGELOG.md"

[project.scripts]
agent-eval = "agent_evaluator.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["agent_evaluator"]

[tool.hatch.build.targets.sdist]
include = [
    "agent_evaluator/",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]
exclude = [
    "Evaluator_Examples/",
    "Docs/",
    "HTML_Book/",
    "catboost_info/",
    "output/",
    "dist/",
    ".env",
    "*.DS_Store",
]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP007"]  # UP007: Union[X,Y] → X|Y (py38 compat)

[tool.mypy]
# mypy 1.9+가 python_version=3.8 타입체킹 자체를 지원 중단해 3.9로 올렸다가,
# opentelemetry·mcp·huggingface_hub 등 py.typed 배포 서드파티 패키지가 내부적으로
# match문(3.10+ 문법)을 써서 3.9로도 파싱이 계속 실패해("Pattern matching is only
# supported in Python 3.10 and greater" → 전체 검사 중단) 3.10으로 다시 올렸다.
# 패키지 런타임 지원 대상(3.8+, ruff target-version=py38과 동일)을 바꾸는 게
# 아니라 mypy 자체의 파서 제약에 맞추는 것뿐이다.
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false

# opentelemetry·mcp는 위 이유로 이미 마주쳤던 서드파티라 소스를 따라 들어가지
# 않도록 명시적으로 skip한다(3.10에서도 필요 없어졌지만, 향후 다른 버전에서
# 다시 문제가 되어도 이 두 패키지만은 우리 검사 대상이 아님을 고정해둔다).
[[tool.mypy.overrides]]
module = ["opentelemetry.*", "mcp.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=agent_evaluator --cov-report=html --cov-report=term"
asyncio_mode = "auto"

[tool.coverage.run]
# serve/server.py가 FastAPI Jinja2Templates(directory=...)로 .html.j2 템플릿을 렌더링하면,
# Jinja2가 컴파일한 템플릿 코드 객체의 co_filename이 디스크상의 실제 .html.j2 경로를 그대로
# 가리킨다 — coverage.py가 이걸 평범한 .py 소스 파일로 착각해 추적 대상에 넣고, HTML 리포트
# 생성 단계(coverage/phystokens.py::find_soft_key_lines)에서 그 파일 내용을 ast.parse()하려다
# Jinja/HTML 문법(예: "{{ title }}")을 만나 INTERNALERROR로 죽는다 — 테스트 자체는 전부
# 통과해도 매번 재현된다. 애초에 .html.j2는 커버리지 측정 대상(진짜 .py 소스)이 아니므로
# 완전히 제외한다.
omit = [
    "agent_evaluator/serve/templates/*",
]
