[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-evaluator"
version = "0.9.6"
description = "Production-ready evaluation framework for AI agents — 58 metrics (25 native + 33 Harness Config) across 7 evaluation gates: goal achievement, behavioral integrity, reliability, performance, security, multi-agent coordination, and observability"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Sungwoo Kim", email = "sungwoo.kim@gmail.com"},
]
maintainers = [
    {name = "Sungwoo Kim", email = "sungwoo.kim@gmail.com"},
]
keywords = [
    "ai", "agent", "evaluation", "monitoring", "performance",
    "llm", "langchain", "crewai", "langgraph", "autogen",
    "hallucination", "accuracy", "latency", "token", "security",
    "rag", "deepeval", "ragas", "observability", "benchmark",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

dependencies = [
    # 수치 연산 / 지표 집계 / 환경변수 — 진짜 코어만
    "numpy>=1.20.0,<3.0.0",
    "pandas>=1.3.0,<4.0.0",
    "python-dotenv>=0.19.0,<2.0.0",
    # LLMJudge 엔진 (평가 기능 핵심)
    "openai>=2.0.0,<3.0.0",
    "anthropic>=0.20.0,<1.0.0",
    # 웹 대시보드, OTEL, PDF 처리는 각각 [serve] / [otel] / [pdf] extras로 설치
]

[project.optional-dependencies]
# ════════════════════════════════════════════════════════════════════════════
# Group 1: SDK 자체 기능 (agent-eval dashboard / monitor / LLMJudge / PDF)
# ════════════════════════════════════════════════════════════════════════════

# LLM 클라이언트 — LLMJudge 엔진 (빠름, ~5개 패키지)
# agent_evaluator/integrations/llm_judge.py 에서 사용
llm = [
    "openai>=2.0.0,<3.0.0",
    "anthropic>=0.20.0,<1.0.0",
]
# 웹 대시보드 — agent-eval serve (빠름, ~8개 패키지)
# agent_evaluator/serve/ 에서 사용
serve = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "python-multipart>=0.0.9,<1.0.0",
]
# 운영 실시간 모니터링 — Phoenix + OTEL (중간, ~20개 패키지)
# agent-eval monitor 명령어 / core/otel/ / core/trackers/monitor.py 에서 사용
otel = [
    "opentelemetry-sdk>=1.20.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0,<2.0.0",
    # v15.4.0에서 pydantic-ai 메타패키지 의존성 제거됨 → 핀 해제
    "arize-phoenix>=15.4.0,<16.0.0",
]
# PDF 처리 — 한국어 RAG 데이터셋 생성기 (빠름, ~2개 패키지)
# agent_evaluator/datasets/korean_rag_dataset_generator.py 에서 사용
pdf = [
    "pdfplumber>=0.10.0,<1.0.0",
]
# 한국어 형태소 분석 — AccuracyEvaluator / HallucinationDetector 정확도 향상 (빠름, ~1개 패키지)
# use_korean_tokenizer=True 시 자동 사용; 미설치 시 공백 분리 폴백
korean = [
    "kiwipiepy>=0.17.0",
]
# 의미 기반 환각 탐지 — HallucinationDetector 정확도 향상 (무거움, ~500MB 모델 다운로드)
# use_semantic_similarity=True 시 자동 사용; 미설치 시 단어 중복 방식으로 폴백
# paraphrase-multilingual-MiniLM-L12-v2: 50개 언어 지원 (한국어 포함)
semantic = [
    "sentence-transformers>=2.7.0,<5.0.0",
]
# SDK 전체 묶음 — llm + serve + otel + pdf (운영 배포 권장)
sdk = [
    "openai>=2.0.0,<3.0.0",
    "anthropic>=0.20.0,<1.0.0",
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "opentelemetry-sdk>=1.20.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0,<2.0.0",
    # v15.4.0에서 pydantic-ai 메타패키지 의존성 제거됨 → 핀 해제
    "arize-phoenix>=15.4.0,<16.0.0",
    "pdfplumber>=0.10.0,<1.0.0",
    "kiwipiepy>=0.17.0",
]

# ════════════════════════════════════════════════════════════════════════════
# Group 2: Evaluator_Examples 예제 실행
# ════════════════════════════════════════════════════════════════════════════

# 모든 예제 실행 — sdk + eval (예제 01-06은 코어만 필요, 07은 llm+otel+eval 필요)
# pip install "agent-evaluator[examples]" 로 Evaluator_Examples/ 전체 실행 가능
examples = [
    "openai>=2.0.0,<3.0.0",
    "anthropic>=0.20.0,<1.0.0",
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "opentelemetry-sdk>=1.20.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0,<2.0.0",
    # v15.4.0에서 pydantic-ai 메타패키지 의존성 제거됨 → 핀 해제
    "arize-phoenix>=15.4.0,<16.0.0",
    "pdfplumber>=0.10.0,<1.0.0",
    "deepeval>=3.0.0,<4.0.0",
    "ragas>=0.4.0,<2.0.0",
    "datasets>=4.0.0,<6.0.0",
    "langchain>=1.0.0,<3.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "kiwipiepy>=0.17.0",
]

# ════════════════════════════════════════════════════════════════════════════
# Group 3: 프레임워크 확장 (agent_evaluator/integrations/ 에서 try/except로 사용)
# ════════════════════════════════════════════════════════════════════════════

# 외부 평가 라이브러리 — DeepEval / Ragas (중간, langchain 필요)
# ragas 0.4.x API: EvaluationDataset + SingleTurnSample, datasets>=4.0.0 필요
# agent_evaluator/integrations/metric_adapters.py 에서 사용
eval = [
    "deepeval>=3.0.0,<4.0.0",
    "ragas>=0.4.0,<2.0.0",
    "datasets>=4.0.0,<6.0.0",
    "langchain>=1.0.0,<3.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "kiwipiepy>=0.17.0",
]
# LangChain / LangGraph 통합 (중간, ~30개 패키지)
# langchain 1.x LCEL Runnable 기반, BaseCallbackHandler 실시간 추적
langchain = [
    "langchain>=1.0.0,<3.0.0",
    "langchain-core>=1.0.0,<2.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "langchain-anthropic>=1.0.0,<2.0.0",
    "langgraph>=1.0.0,<3.0.0",
]
# DSPy 통합 (중간, ~10개 패키지)
dspy = [
    "dspy-ai>=2.0.0",
]
# PydanticAI 통합 (빠름, ~5개 패키지)
# 1.0.0에서 API 전면 재설계 — 0.x와 호환 불가
pydanticai = [
    "pydantic-ai>=1.0.0,<2.0.0",
]
# CrewAI 통합 (무거움 — 전이 의존성 100개+, 단독 격리)
# crewai 1.x: CrewOutput.raw, crew.usage_metrics, result.tasks_output
crewai = [
    "crewai>=1.0.0,<2.0.0",
]
# AutoGen 통합 (무거움, 단독 격리)
# autogen-agentchat 0.7.x async-first API: on_messages(), team.run()
autogen = [
    "pyautogen>=0.3.0,<1.0.0",
    "autogen-agentchat>=0.4.0,<1.0.0",
    "autogen-core>=0.4.0,<1.0.0",
]

# ════════════════════════════════════════════════════════════════════════════
# Group 4: 선택적 연동 (각 기능 전용)
# ════════════════════════════════════════════════════════════════════════════

# 대시보드 Parquet / Excel 내보내기
# agent_evaluator/serve/routers/export.py 에서 사용
# 미설치 시: Parquet/Excel 엔드포인트 HTTP 409 반환
export = [
    "pyarrow>=10.0.0",
    "openpyxl>=3.1.0",
]
# Weights & Biases 실험 추적 연동
# PerformanceMonitor.export_to_wandb() 에서 사용
wandb = [
    "wandb>=0.17.0",
]
# MLflow 실험 추적 연동
# PerformanceMonitor.export_to_mlflow() 에서 사용
mlflow = [
    "mlflow>=2.0.0",
]

# ════════════════════════════════════════════════════════════════════════════
# 조합 편의 extras
# ════════════════════════════════════════════════════════════════════════════

# 전체 (crewai/autogen 포함 — ⚠️ 설치 10분+ 소요, pydantic 버전 충돌 silent downgrade 가능)
full = [
    "openai>=2.0.0,<3.0.0",
    "anthropic>=0.20.0,<1.0.0",
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "opentelemetry-sdk>=1.20.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0,<2.0.0",
    # v15.4.0에서 pydantic-ai 메타패키지 의존성 제거됨 → 핀 해제
    "arize-phoenix>=15.4.0,<16.0.0",
    "pdfplumber>=0.10.0,<1.0.0",
    "deepeval>=3.0.0,<4.0.0",
    "ragas>=0.4.0,<2.0.0",
    "datasets>=4.0.0,<6.0.0",
    "langchain>=1.0.0,<3.0.0",
    "langchain-core>=1.0.0,<2.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "langchain-anthropic>=1.0.0,<2.0.0",
    "langgraph>=1.0.0,<3.0.0",
    "crewai>=1.0.0,<2.0.0",
    "pyautogen>=0.3.0,<1.0.0",
    "autogen-agentchat>=0.4.0,<1.0.0",
    "autogen-core>=0.4.0,<1.0.0",
    "dspy-ai>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
    "pre-commit>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/bullpeng72/Agent-Evaluator"
Repository = "https://github.com/bullpeng72/Agent-Evaluator"
"Bug Tracker" = "https://github.com/bullpeng72/Agent-Evaluator/issues"
Documentation = "https://github.com/bullpeng72/Agent-Evaluator/blob/main/README.md"

[project.scripts]
agent-eval = "agent_evaluator.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["agent_evaluator"]

[tool.hatch.build.targets.sdist]
include = [
    "agent_evaluator/",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]
exclude = [
    "Evaluator_Examples/",
    "Docs/",
    "HTML_Book/",
    "catboost_info/",
    "output/",
    "dist/",
    ".env",
    "*.DS_Store",
]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP007"]  # UP007: Union[X,Y] → X|Y (py38 compat)

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=agent_evaluator --cov-report=html --cov-report=term"
asyncio_mode = "auto"
