[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agent-evaluator"
version = "1.0.0"
description = "Production-ready evaluation framework for AI agents — 58 metrics (25 native + 33 Harness Config) across 7 evaluation gates: goal achievement, behavioral integrity, reliability, performance, security, multi-agent coordination, and observability"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Sungwoo Kim", email = "sungwoo.kim@gmail.com"},
]
maintainers = [
    {name = "Sungwoo Kim", email = "sungwoo.kim@gmail.com"},
]
keywords = [
    "ai", "agent", "evaluation", "monitoring", "performance",
    "llm", "langchain", "crewai", "langgraph", "autogen",
    "hallucination", "accuracy", "latency", "token", "security",
    "rag", "deepeval", "ragas", "observability", "benchmark",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

dependencies = [
    # 수치 연산 / 지표 집계 / 환경변수 — 진짜 코어만
    "numpy>=1.20.0,<3.0.0",
    "pandas>=1.3.0,<4.0.0",
    "python-dotenv>=0.19.0,<2.0.0",
    # LLMJudge 엔진 (평가 기능 핵심)
    "openai>=2.0.0,<3.0.0",
    "anthropic>=0.20.0,<1.0.0",
    # 웹 대시보드, OTEL, PDF 처리는 각각 [serve] / [otel] / [pdf] extras로 설치
]

[project.optional-dependencies]
# ════════════════════════════════════════════════════════════════════════════
# 5개 카테고리 (사용자 의도 기준) — extra 이름/버전은 하위호환을 위해 그대로 유지.
# 아래 헤더 순서는 오직 문서화 목적이며 실제 설치 동작에는 영향 없음.
#
#   1. 기본 측정 + 진단 — extra 불필요, dependencies(위)만으로 전부 동작
#      25 트래커 · 33 Harness Config · 7 Gate · LLMJudge 엔진 ·
#      RCA 진단 엔진(agent_evaluator.rca/ontology/schemas — 표준 라이브러리만 사용, 무료) ·
#      CLI(gate/diagnose/abtest/claims/trend/dataset)
#   2. SDK — 대시보드 + 운영 모니터링           → llm · serve · otel · pdf · korean · semantic · sdk
#   3. 실시간 가드레일 — OpenCode + MCP 연동     → mcp
#   4. 내 에이전트 프레임워크                    → eval · langchain · dspy · pydanticai · crewai · autogen
#   5. 예제 실행 / 전체 설치 / 기여              → examples · full · dev
#
#   (그 외 export/wandb/mlflow는 위 5개에 안 들어가는 단일 기능 소형 extra — 맨 아래 별도 절)
# ════════════════════════════════════════════════════════════════════════════

# ────────────────────────────────────────────────────────────────────────────
# 카테고리 2: SDK — 대시보드 + 운영 모니터링 (agent-eval dashboard / monitor)
# ────────────────────────────────────────────────────────────────────────────

# LLM 클라이언트 — LLMJudge 엔진 (빠름, ~5개 패키지)
# agent_evaluator/integrations/llm_judge.py 에서 사용
llm = [
    "openai>=2.0.0,<3.0.0",
    "anthropic>=0.20.0,<1.0.0",
]
# 웹 대시보드 — agent-eval serve (빠름, ~8개 패키지)
# agent_evaluator/serve/ 에서 사용
serve = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "python-multipart>=0.0.9,<1.0.0",
]
# 운영 실시간 모니터링 — Phoenix + OTEL (중간, ~20개 패키지)
# agent-eval monitor 명령어 / core/otel/ / core/trackers/monitor.py 에서 사용
otel = [
    "opentelemetry-sdk>=1.20.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0,<2.0.0",
    # v15.4.0에서 pydantic-ai 메타패키지 의존성 제거됨 → 핀 해제
    "arize-phoenix>=15.4.0,<19.0.0",
]
# PDF 처리 — 한국어 RAG 데이터셋 생성기 (빠름, ~2개 패키지)
# agent_evaluator/datasets/korean_rag_dataset_generator.py 에서 사용
pdf = [
    "pdfplumber>=0.10.0,<1.0.0",
]
# 한국어 형태소 분석 — AccuracyEvaluator / HallucinationDetector 정확도 향상 (빠름, ~1개 패키지)
# use_korean_tokenizer=True 시 자동 사용; 미설치 시 공백 분리 폴백
korean = [
    "kiwipiepy>=0.17.0",
]
# 의미 기반 환각 탐지 — HallucinationDetector 정확도 향상 (무거움, ~500MB 모델 다운로드)
# use_semantic_similarity=True 시 자동 사용; 미설치 시 단어 중복 방식으로 폴백
# paraphrase-multilingual-MiniLM-L12-v2: 50개 언어 지원 (한국어 포함)
semantic = [
    "sentence-transformers>=2.7.0,<6.0.0",
]
# SDK 전체 묶음 — llm + serve + otel + pdf + korean (운영 배포 권장)
sdk = [
    "openai>=2.0.0,<3.0.0",
    "anthropic>=0.20.0,<1.0.0",
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "opentelemetry-sdk>=1.20.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0,<2.0.0",
    # v15.4.0에서 pydantic-ai 메타패키지 의존성 제거됨 → 핀 해제
    "arize-phoenix>=15.4.0,<19.0.0",
    "pdfplumber>=0.10.0,<1.0.0",
    "kiwipiepy>=0.17.0",
]

# ────────────────────────────────────────────────────────────────────────────
# 카테고리 3: 실시간 가드레일 — OpenCode + MCP 연동
# ────────────────────────────────────────────────────────────────────────────

# search_violations + recommend_fix MCP 서버 2종 (SPEC-024 REQ-4 · v1.0.0 recommend_fix 추가,
# 빠름 ~1개 패키지) — agent_evaluator/integrations/violation_search_mcp.py,
# recommend_fix_mcp.py 에서 사용. 둘 다 mcp.server.fastmcp.FastMCP를 함수 내부에서 지연
# import하므로, 이 extra 없이도 두 함수의 로직 자체(search_violations()/추천 조회, agent-eval
# diagnose·ch28_rca_diagnosis.py가 직접 호출하는 경로)는 base install만으로 이미 동작한다 —
# 이 extra는 OpenCode 등 MCP 클라이언트가 이 둘을 "도구"로 자율 호출하는 경로만 켠다.
# 등록: agent-eval opencode install --with-violation-search / --with-recommend-fix (권장)
# 수동 등록: opencode mcp add agent-evaluator-violations -- python -m agent_evaluator.integrations.violation_search_mcp
# 참고: opencode CLI 자체(Node/Bun)는 이 extra 범위 밖 — 별도로 설치 필요
mcp = [
    "mcp>=1.0.0",
]

# ────────────────────────────────────────────────────────────────────────────
# 카테고리 4: 내 에이전트 프레임워크 (agent_evaluator/integrations/ 에서 try/except로 사용)
# ────────────────────────────────────────────────────────────────────────────

# 외부 평가 라이브러리 — DeepEval / Ragas (중간, langchain 필요)
# ragas 0.4.x API: EvaluationDataset + SingleTurnSample, datasets>=4.0.0 필요
# agent_evaluator/integrations/metric_adapters.py 에서 사용
eval = [
    "deepeval>=3.0.0,<5.0.0",
    "ragas>=0.4.0,<2.0.0",
    "datasets>=4.0.0,<6.0.0",
    "langchain>=1.0.0,<3.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "kiwipiepy>=0.17.0",
]
# LangChain / LangGraph 통합 (중간, ~30개 패키지)
# AgentExecutor.invoke() dict 또는 LCEL 직접 반환 AIMessage(.tool_calls)에서
# 사후 추출 (콜백 기반 실시간 추적 아님) — agent_evaluator/decorators.py 참고
langchain = [
    "langchain>=1.0.0,<3.0.0",
    "langchain-core>=1.0.0,<2.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "langchain-anthropic>=1.0.0,<2.0.0",
    "langgraph>=1.0.0,<3.0.0",
]
# DSPy 통합 (중간, ~10개 패키지)
dspy = [
    "dspy-ai>=2.0.0",
]
# PydanticAI 통합 (빠름, ~5개 패키지)
# 1.0.0에서 API 전면 재설계 — 0.x와 호환 불가
pydanticai = [
    "pydantic-ai>=1.0.0,<3.0.0",
]
# CrewAI 통합 (무거움 — 전이 의존성 100개+, 단독 격리)
# crewai 1.x: CrewOutput.raw, crew.usage_metrics, result.tasks_output
crewai = [
    "crewai>=1.0.0,<2.0.0",
]
# AutoGen 통합 (무거움, 단독 격리)
# autogen-agentchat >=0.4.0 async-first API: team.run() (레거시 pyautogen도 폴백 지원)
autogen = [
    "pyautogen>=0.3.0,<1.0.0",
    "autogen-agentchat>=0.4.0,<1.0.0",
    "autogen-core>=0.4.0,<1.0.0",
]

# ────────────────────────────────────────────────────────────────────────────
# 카테고리 5: 예제 실행 / 전체 설치 / 기여
# ────────────────────────────────────────────────────────────────────────────

# 모든 예제 실행 — sdk + eval (예제 대부분은 코어만 필요 — agent_evaluator 내부에서 지연 로딩
# + graceful fallback이라 이 extra 없이도 실행은 되지만, 이 extra가 있어야 DeepEval/Ragas/
# 대시보드/Phoenix 파트가 mock이 아니라 실제로 동작한다)
# pip install "agent-evaluator[examples]" 로 Evaluator_Examples/ 전체 실행 가능
examples = [
    "openai>=2.0.0,<3.0.0",
    "anthropic>=0.20.0,<1.0.0",
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "opentelemetry-sdk>=1.20.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0,<2.0.0",
    # v15.4.0에서 pydantic-ai 메타패키지 의존성 제거됨 → 핀 해제
    "arize-phoenix>=15.4.0,<19.0.0",
    "pdfplumber>=0.10.0,<1.0.0",
    "deepeval>=3.0.0,<5.0.0",
    "ragas>=0.4.0,<2.0.0",
    "datasets>=4.0.0,<6.0.0",
    "langchain>=1.0.0,<3.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "kiwipiepy>=0.17.0",
]
# 전체 (crewai/autogen 포함 — ⚠️ 설치 10분+ 소요, pydantic 버전 충돌 silent downgrade 가능)
full = [
    "openai>=2.0.0,<3.0.0",
    "anthropic>=0.20.0,<1.0.0",
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "opentelemetry-sdk>=1.20.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0,<2.0.0",
    # v15.4.0에서 pydantic-ai 메타패키지 의존성 제거됨 → 핀 해제
    "arize-phoenix>=15.4.0,<19.0.0",
    "pdfplumber>=0.10.0,<1.0.0",
    "deepeval>=3.0.0,<5.0.0",
    "ragas>=0.4.0,<2.0.0",
    "datasets>=4.0.0,<6.0.0",
    "langchain>=1.0.0,<3.0.0",
    "langchain-core>=1.0.0,<2.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "langchain-anthropic>=1.0.0,<2.0.0",
    "langgraph>=1.0.0,<3.0.0",
    "crewai>=1.0.0,<2.0.0",
    "pyautogen>=0.3.0,<1.0.0",
