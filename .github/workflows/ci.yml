name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (dev extras)
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest --no-cov -q

  lint-and-typecheck:
    name: ruff + mypy (quality ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package (dev extras)
        run: pip install -e ".[dev]"

      # SPEC-021: 기존 부채(도입 시점 4,120건/318건, .github/quality-baseline.json)를
      # 전부 정리하는 대신, "이번 변경이 부채를 늘렸는가"만 검사해 hard-block한다 —
      # SPEC-017의 report-only 2-스텝 구성을 대체(README.md/SPEC-021.md 구현 노트 참조).
      - name: quality ratchet (ruff + mypy vs baseline)
        run: python scripts/quality_ratchet.py
