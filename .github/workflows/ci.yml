name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (dev extras)
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest --no-cov -q

  lint-and-typecheck:
    name: ruff + mypy (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package (dev extras)
        run: pip install -e ".[dev]"

      # SPEC-017: 도입 시점 baseline 확인 결과(2026-07-03) ruff 4,063건 / mypy 305건의
      # 기존 경고가 있어, 이 잡을 hard-block으로 켜면 CI가 즉시 영구적으로 실패한다.
      # continue-on-error로 리포트만 하고 별도 정리 작업 완료 후 강제 실패로 전환할 것
      # (Rollout 1단계 — README.md/SPEC-017.md 구현 노트 참조).
      - name: ruff check (non-blocking)
        continue-on-error: true
        run: ruff check agent_evaluator/

      - name: mypy (non-blocking)
        continue-on-error: true
        run: mypy agent_evaluator/
